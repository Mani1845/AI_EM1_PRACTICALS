<!DOCTYPE html>
<html>
<head>
    <title>Gaussian Naive Bayes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <h1>Student Performance Prediction</h1>
    <form method="POST">
        <label>Study Hours (0–24)</label>
        <input type="number" name="hours" min="0" max="24" step="0.1" required>
        <label>Attendance (0–100)</label>
        <input type="number" name="attendance" min="0" max="100" required>
        <label>Previous Marks (0–100)</label>
        <input type="number" name="marks" min="0" max="100" required>
        <button type="submit">Predict Performance</button>
    </form>
    {% if result %}<div class="result"><h2>{{ result }}</h2></div>{% endif %}
</div>
</body>
</html>
