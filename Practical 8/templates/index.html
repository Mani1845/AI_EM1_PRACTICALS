<!DOCTYPE html>
<html>
<head>
    <title>Sentiment Analysis</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <h1>Sentiment Analysis</h1>
    <p>Enter a sentence to identify its sentiment.</p>
    <form method="POST">
        <textarea name="text" placeholder="Enter your review here..." required></textarea>
        <button type="submit">Analyze Sentiment</button>
    </form>
    {% if result %}
    <div class="result"><h2>Sentiment: {{ result }}</h2></div>
    {% endif %}
</div>
</body>
</html>
